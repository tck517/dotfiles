# Default shell
set-option -g default-shell /opt/homebrew/bin/fish

# Prefix Configuration
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# General Settings
set -sg escape-time 0
set-option -g default-terminal "screen-256color"
setw -g wrap-search on
setw -g word-separators ' -_@'

# Status Bar Configuration
set-option -g status "on"
set-option -g status-justify "left"
set-option -g status-left-style none
set-option -g status-left-length "80"
set-option -g status-right-style none
set-option -g status-right-length "80"
set-window-option -g window-status-separator ""

# Starship-inspired Colorscheme
# Default statusbar colors (dark bg, white text — matches terminal)
set-option -g status-style bg=colour235,fg=colour250

# Default window title colors
set-window-option -g window-status-style bg=colour235,fg=colour245

# Default window with an activity alert
set-window-option -g window-status-activity-style bg=colour235,fg=colour214

# Active window title colors (bold cyan — matches Starship directory)
set-window-option -g window-status-current-style bg=colour235,fg=colour51,bold

# Pane border colors (subtle borders, cyan active — matches Starship prompt)
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour51'

# Message colors
set-option -g message-style bg=colour235,fg=colour51
set-option -g message-command-style bg=colour235,fg=colour51

# Pane number display
set-option -g display-panes-active-colour colour51
set-option -g display-panes-colour colour238

# Clock (green — matches Starship success prompt)
set-window-option -g clock-mode-colour colour76

# Bell (red — matches Starship error prompt)
set-window-option -g window-status-bell-style bg=colour235,fg=colour196

# Window styles
set -g window-style 'fg=colour250,bg=colour235'
set -g window-active-style 'fg=colour254,bg=black'

# Status bar content (Starship-style: green session, cyan active window, purple accents)
set-option -g status-left "#[fg=colour76,bold] #S #[nobold]"
set-option -g status-right "#[fg=colour214]%Y-%m-%d #[fg=colour141]%H:%M #[fg=colour245] #h "
set-window-option -g window-status-current-format "#[fg=colour51,bold] #I:#W#[nobold] "
set-window-option -g window-status-format "#[fg=colour245] #I:#W "

# Key Bindings for splits with current path
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Smart pane switching with awareness of Vim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Turn on activity + bell monitoring in all windows
set -g monitor-activity on
set -g monitor-bell on

# Only alert for *non-current* windows
set -g activity-action other
set -g bell-action other

# When there is activity/bell, send a real BEL to the terminal
# (instead of tmux just printing a status message)
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off

