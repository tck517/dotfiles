# Font settings for sharp, legible text
font_family      JetBrains Mono
font_size        14.0
modify_font cell_height 0
modify_font cell_width 0
disable_ligatures never

# Enable true color for better contrast and clarity
term             xterm-kitty
macos_option_as_alt yes

# Performance tweaks
repaint_delay    10
# Faster redraws for smooth recording
sync_to_monitor  no
input_delay      0
# Reduces latency

# Window and background settings
background_opacity 1.0
# Fully opaque for consistent recording
window_padding_width 10
# Adds padding to avoid text cutoff

# Retina display optimization
macos_thicken_font 0.25
# Slight thickening for better visibility on high-DPI screens
cursor_blink_interval 0
# Disables blinking cursor to reduce flicker in recordings

# Scrollback for Neovim/tmux usage
scrollback_lines 10000
# Large buffer for long sessions
# get rid of the os app bar
hide_window_decorations yes

# Terminal bell behavior
enable_audio_bell no         # or yes, if you like sound
# small flash on bell
visual_bell_duration 0.1
window_alert_on_bell yes     # bounce dock / flash taskbar when not focused
bell_on_tab yes              # show a bell symbol on the tab if that tab isn't focused



# BEGIN_KITTY_THEME
# Rosé Pine
include current-theme.conf
# END_KITTY_THEME